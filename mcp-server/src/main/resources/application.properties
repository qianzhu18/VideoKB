server.port=${MCP_SERVER_PORT:9091}
spring.application.name=dovideo-mcp-server

# Comma-separated bearer tokens granted to MCP clients (the AI assistant side).
mcp.client-tokens=${MCP_CLIENT_TOKENS:}

# Upstream DoVideo Spring Boot API. The adapter never touches MySQL/MinIO/Qdrant directly.
mcp.upstream.base-url=${DOVIDEO_API_BASE:http://127.0.0.1:9090}
# Either a reusable session token, or service-account credentials with auto re-login.
mcp.upstream.token=${DOVIDEO_API_TOKEN:}
mcp.upstream.username=${DOVIDEO_API_USERNAME:}
mcp.upstream.password=${DOVIDEO_API_PASSWORD:}

# JSONL audit trail following the knowledge_audit_logs design (who/what/when/outcome).
mcp.audit.path=${MCP_AUDIT_PATH:data/mcp-audit.jsonl}
