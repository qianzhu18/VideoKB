# Optional, isolated BM25 experiment. No product/Qdrant volumes are mounted.
services:
  milvus:
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "127.0.0.1:${MILVUS_EXPERIMENT_PORT:-19531}:19530"
      - "127.0.0.1:${MILVUS_EXPERIMENT_HEALTH_PORT:-19093}:9091"
    volumes:
      - milvus_experiment:/var/lib/milvus
      - ./infra/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
volumes:
  milvus_experiment:
